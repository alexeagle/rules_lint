name: CI

on:
  push:
    branches: [main, 1.x]
  pull_request:
    branches: [main, 1.x]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  id-token: write

# Linux root tests and example format/lint/Bats checks run on Buildkite.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify bcr patches
        run: patch --dry-run -p1 --fuzz 0 < .bcr/patches/*.patch
      - uses: lycheeverse/lychee-action@a8c4c7cb88f0c7386610c35eb25108e448569cb0 # v2.7.0
        with:
          # Allow 503 Service Unavailable when rate limited
          args: --accept '200..=204,503' --base ${{ github.workspace }} --verbose --no-progress './**/*.md' './**/*.html'
          fail: false # sigh
  # Go workspace and published-tool compatibility checks remain on GHA.
  go-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [7.x, 8.x, 9.x]
    env:
      USE_BAZEL_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        with:
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - name: Test Go workspace
        working-directory: examples/go
        run: aspect test -- //...
      - name: Test published Go tools
        run: tools/release/test_go_prebuilts.sh
  test:
    strategy:
      matrix:
        version:
          - 7.x
          - 8.x
          - 9.x
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelrc: |
            common --announce_rc
            common --color=yes
      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        with:
          aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
      - name: Test
        # Reduce time on macos runners by testing one example
        working-directory: examples/java
        env:
          USE_BAZEL_VERSION: ${{ matrix.version }}
        run: bazel test //...
      - name: Test clang-tidy sysroot handling in examples/cpp
        # Buildkite pins C++ lint checks to Bazel 8; match that version here.
        if: matrix.version == '8.x'
        working-directory: examples/cpp
        env:
          USE_BAZEL_VERSION: ${{ matrix.version }}
        run: |
          bazel test --test_output=errors //test:clang_tidy_stdlib
          sdk="$(xcrun --show-sdk-path)"
          bazel test --test_output=errors --copt=-isysroot --copt="$sdk" //test:clang_tidy_stdlib
          bazel test --test_output=errors --copt="-isysroot$sdk" //test:clang_tidy_stdlib

      - name: Test published Go tools
        env:
          USE_BAZEL_VERSION: ${{ matrix.version }}
        run: tools/release/test_go_prebuilts.sh

  ty-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rules-python: [pinned, 2.5.0-rc0]
    env:
      USE_BAZEL_VERSION: "8.x"
    steps:
      - uses: actions/checkout@v6
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
      - name: Test Python type-only dependencies
        run: examples/python/test/ty_compatibility.sh "${{ matrix.rules-python }}" --test_output=errors

  # Stable check for the jobs still hosted on GitHub Actions.
  # Buildkite reports the migrated Linux checks separately.
  test-all:
    name: test-all
    runs-on: ubuntu-latest
    needs: [checks, go-test, test, ty-integration]
    if: always()
    steps:
      - name: All required jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -e 'all(.[]; .result == "success")' <<<"${NEEDS}"
