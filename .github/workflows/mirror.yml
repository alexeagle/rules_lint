name: Mirror Releases
on:
  # Trigger manually in the UI
  workflow_dispatch:
  # Trigger daily at 06:45 UTC
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron: "45 6 * * *"

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check mirror bot access
        env:
          GH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
        run: |
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions.push')" != "true" ]]; then
            echo "::error::BCR_PUBLISH_TOKEN needs write access to $GITHUB_REPOSITORY. See .github/workflows/README.md."
            exit 1
          fi
      - name: Update ruff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./lint/mirror_ruff.sh
          npx @bazel/buildifier lint/ruff_versions.bzl
      - name: Find Updates and Render Lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/workflows/update_multitool.py lint/multitool.lock.json format/multitool.lock.json
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ secrets.BCR_PUBLISH_TOKEN }}
          title: "chore: mirror external releases"
          commit-message: "chore: mirror external releases"
          author: "bazel-contrib-bot <210917734+bazel-contrib-bot@users.noreply.github.com>"
          committer: "bazel-contrib-bot <210917734+bazel-contrib-bot@users.noreply.github.com>"
